<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Text to Speech</title>
  </head>
  <body>
    <main>
      <form action="">
        <h1>create and listen to sentences</h1>
        <input type="text" placeholder="አበበ በሶ በላ ።" />
        <div class="defaults">
          <button class="default">
            <h3>እንደምን ፡ አደርሽ ፡ እማዬ? ዛሬ ፡ ቁርሴ ፡ ምንድን ፡ ነው?</h3>
            <h5>Good morning, Mommy? What is my breakfast today?</h5>
          </button>
          <button class="default">
            <h3>ጥርሴን ፡ ቦርሼ ፡ ጨርሻለሁ፤ አሁን ፡ ቦርሳዬን ፡ ልያዝ!</h3>
            <h5>I finished brushing my teeth; now let me grab my backpack!</h5>
          </button>
          <button class="default">
            <h3>ና ፡ አብረን ፡ ኳስ ፡ እንጫወት! በጣም ፡ ደስ ፡ ይላል!</h3>
            <h5>Come let's play ball together! It is so much fun!</h5>
          </button>
          <button class="submit" type="submit">
            listen

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="26"
              height="26"
              fill="currentColor"
              class="bi bi-volume-up"
              viewBox="0 0 16 16"
            >
              <path
                d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"
              />
              <path
                d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"
              />
              <path
                d="M10.025 8a4.5 4.5 0 0 1-1.318 3.182L8 10.475A3.5 3.5 0 0 0 9.025 8c0-.966-.392-1.841-1.025-2.475l.707-.707A4.5 4.5 0 0 1 10.025 8M7 4a.5.5 0 0 0-.812-.39L3.825 5.5H1.5A.5.5 0 0 0 1 6v4a.5.5 0 0 0 .5.5h2.325l2.363 1.89A.5.5 0 0 0 7 12zM4.312 6.39 6 5.04v5.92L4.312 9.61A.5.5 0 0 0 4 9.5H2v-3h2a.5.5 0 0 0 .312-.11"
              />
            </svg>
          </button>
        </div>
      </form>
    </main>
  </body>
  <script src="index.js"></script>
</html>
